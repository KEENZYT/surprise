<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сюрприз ❤️</title>
    <style>
        body { 
            font-family: 'Georgia', serif; 
            background-color: #fdf2f8; 
            color: #4a4a4a; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }
        h1 { color: #db2777; margin-bottom: 5px; font-size: 2em; }
        .subtitle { font-size: 1.1em; margin-bottom: 30px; font-style: italic; color: #6b7280; }
        .gallery { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 30px; 
            max-width: 500px; 
            margin: 0 auto; 
        }
        .card { 
            background: white; 
            padding: 15px 15px 5px 15px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
            width: 100%; 
            box-sizing: border-box; 
        }
        img { width: 100%; border-radius: 10px; height: auto; display: block; }
        .caption { margin-top: 15px; margin-bottom: 15px; font-size: 1.1em; font-weight: bold; color: #db2777; }
    </style>
</head>
<body>
    <h1>Я безумно скучал! ❤️</h1>
    <p class="subtitle">Эта неделя тянулась целую вечность...</p>
    
    <div class="gallery">
        <div class="card">
            <img src="image_49ca63.jpg" alt="Мы">
            <p class="caption">Даже в отражении витрин я вижу только нас ✨</p>
        </div>
        
        <div class="card">
            <img src="image_48de08.jpg" alt="Мы">
            <p class="caption">С тобой каждый момент становится сказочным 🌌</p>
        </div>
        
        <div class="card">
            <img src="image_241425.jpg" alt="Мы">
            <p class="caption">Наши лучшие ночи и самые теплые воспоминания 🌃</p>
        </div>
        
        <div class="card">
            <img src="image_0ac7bb.jpg" alt="Мы">
            <p class="caption">Готов носить тебя на руках всю жизнь! 🥰</p>
        </div>
    </div>
</body>
</html>
